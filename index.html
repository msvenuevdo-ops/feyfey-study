<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดเตรียมฯ ของเฟย์เฟย์</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fff3f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เฟย์เฟย์">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bunny" viewBox="0 0 64 64">
      <ellipse cx="20" cy="14" rx="7" ry="13" fill="#ffd6e3" stroke="#3a2342" stroke-width="2.5"/>
      <ellipse cx="44" cy="14" rx="7" ry="13" fill="#ffd6e3" stroke="#3a2342" stroke-width="2.5"/>
      <ellipse cx="20" cy="15" rx="3" ry="8" fill="#ff8fb0"/><ellipse cx="44" cy="15" rx="3" ry="8" fill="#ff8fb0"/>
      <ellipse cx="32" cy="40" rx="24" ry="21" fill="#fff" stroke="#3a2342" stroke-width="2.5"/>
      <circle cx="23.5" cy="38" r="3" fill="#3a2342"/><circle cx="40.5" cy="38" r="3" fill="#3a2342"/>
      <circle cx="24.5" cy="37" r="1" fill="#fff"/><circle cx="41.5" cy="37" r="1" fill="#fff"/>
      <ellipse cx="17" cy="45" rx="4.5" ry="3" fill="#ff9bb8"/><ellipse cx="47" cy="45" rx="4.5" ry="3" fill="#ff9bb8"/>
      <path d="M28.5 45 q3.5 3.5 7 0" fill="none" stroke="#3a2342" stroke-width="2.3" stroke-linecap="round"/>
      <path d="M50 22 l2 4.5 4.8.5 -3.6 3.2 1 4.8 -4.2-2.5 -4.2 2.5 1-4.8 -3.6-3.2 4.8-.5z" fill="#ffcf4d" stroke="#3a2342" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<!-- หน้าเข้าสู่ระบบ -->
<section id="gate" class="gate">
  <div class="gate-card">
    <svg class="gate-bunny" viewBox="0 0 64 64" aria-hidden="true"><use href="#bunny"/></svg>
    <h1>สมุดเตรียมฯ<br>ของ<span>เฟย์เฟย์</span></h1>
    <p id="gateMsg">เข้าสู่ระบบด้วยบัญชี Google ของเฟย์เฟย์ก่อนนะ</p>
    <button class="btn pri big" id="loginBtn" type="button" disabled>เข้าสู่ระบบด้วย Google</button>
    <p class="small muted" id="gateNote">ข้อมูลทั้งหมดเก็บใน Google Drive ของเฟย์เฟย์เอง</p>
  </div>
</section>

<!-- แอปหลัก -->
<div id="shell" hidden>
  <header class="top">
    <div class="wrap top-in">
      <svg class="top-bunny" viewBox="0 0 64 64" aria-hidden="true"><use href="#bunny"/></svg>
      <div class="top-title"><b id="topTitle">วันนี้</b><small id="saveState">พร้อมแล้ว</small></div>
      <span class="count-chip" id="countChip">–</span>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="ตั้งค่าและบัญชี">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap" id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="เมนูหลัก">
    <div class="tab-in">
      <a href="#today" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>วันนี้</a>
      <a href="#exams" data-v="exams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>ข้อสอบ</a>
      <a href="#timer" data-v="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>จับเวลา</a>
      <a href="#notes" data-v="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>สมุดสรุป</a>
      <a href="#progress" data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>คะแนน</a>
    </div>
  </nav>
</div>

<dialog id="dlg" closedby="any" aria-labelledby="dlgTitle"><div id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
